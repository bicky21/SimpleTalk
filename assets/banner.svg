<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <title>SimpleTalk – a tiny programming language for people learning to code</title>
  <defs>
    <clipPath id="page"><rect width="1280" height="420" rx="22"/></clipPath>
    <pattern id="rules" width="1280" height="40" patternUnits="userSpaceOnUse" y="0">
      <line x1="0" y1="39.5" x2="1280" y2="39.5" stroke="#C8D5E8" stroke-width="1.5"/>
    </pattern>
  </defs>

  <g clip-path="url(#page)">
    <!-- exercise-book paper -->
    <rect width="1280" height="420" fill="#F1F5FB"/>
    <rect y="40" width="1280" height="360" fill="url(#rules)"/>
    <!-- red margin, doubled like a school notebook -->
    <line x1="92" y1="0" x2="92" y2="420" stroke="#E2687A" stroke-width="2"/>
    <line x1="98" y1="0" x2="98" y2="420" stroke="#E2687A" stroke-width="1" opacity="0.7"/>

    <!-- title: the full stop is the same dot that closes a block -->
    <text x="128" y="160" font-family="Fraunces" font-weight="600" font-size="112"
          fill="#1C2A52" letter-spacing="-2">SimpleTalk</text>
    <circle id="dot" cx="646" cy="141" r="17" fill="#FFD447"/>

    <text x="130" y="240" font-family="Fraunces" font-weight="400" font-size="30" fill="#1C2A52">A tiny programming language</text>
    <text x="130" y="280" font-family="Fraunces" font-weight="400" font-size="30" fill="#1C2A52">for people learning to code.</text>
    <text x="130" y="360" font-family="Fraunces" font-weight="400" font-style="italic" font-size="22" fill="#66728C">Short words, and one dot to close a block.</text>

    <!-- code, written on the ruled lines -->
    <g font-family="JetBrains Mono" font-size="23" fill="#1C2A52">
      <text x="808" y="120"><tspan font-weight="700">let</tspan> score 0</text>
      <text x="808" y="160"><tspan font-weight="700">loop</tspan> i 1..3</text>
      <text x="808" y="200"><tspan xml:space="preserve">    </tspan><tspan font-weight="700">up</tspan> score i</text>
      <circle cx="815" cy="232" r="9" fill="#FFD447"/>
      <circle cx="815" cy="232" r="3.6" fill="#1C2A52"/>
      <text x="808" y="280"><tspan font-weight="700">test</tspan> score = 6</text>
      <text x="808" y="320"><tspan font-weight="700">out</tspan> <tspan fill="#2F67B1">"Total: {score}"</tspan></text>
      <text x="808" y="360" font-size="20" fill="#66728C" font-style="italic" xml:space="preserve">Total: 6    [test] 1 test passed.</text>
    </g>
  </g>
</svg>
