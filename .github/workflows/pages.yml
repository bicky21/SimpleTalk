name: playground

# Builds the online playground (playground/ + the SimpleTalk engine + examples)
# and publishes it with GitHub Pages at https://bicky21.github.io/SimpleTalk/

on:
  push:
    branches: [master]
    paths:
      - "simpletalk/**"
      - "playground/**"
      - "examples/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python playground/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
