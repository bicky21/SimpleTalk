[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simpletalk"
version = "2.3.2"
description = "A friendly, simple programming language that reads like English."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bicky" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development :: Interpreters",
]

[project.scripts]
simpletalk = "simpletalk.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "markdown>=3.4"]

[tool.setuptools]
packages = ["simpletalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
